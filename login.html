<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vital Path - Login</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .card {
    background: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    width: 300px;
  }

  h2 {
    margin-top: 0;
    text-align: center;
  }

  .tabs {
    display: flex;
    margin-bottom: 20px;
  }

  .tabs button {
    flex: 1;
    padding: 8px;
    border: 1px solid #ccc;
    background: #eee;
    cursor: pointer;
  }

  .tabs button.active {
    background: #333;
    color: #fff;
  }

  input {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  button[type="submit"] {
    width: 100%;
    padding: 10px;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  #message {
    margin-top: 15px;
    font-size: 14px;
    white-space: pre-wrap;
  }

  .error {
    color: #b00020;
  }

  .success {
    color: #1b5e20;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>

<div class="card">
  <h2>Vital Path</h2>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showForm('login')">Login</button>
    <button id="signupTab" onclick="showForm('signup')">Sign Up</button>
  </div>

  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <form id="signupForm" class="hidden">
    <input type="text" id="signupName" placeholder="Name" required>
    <input type="email" id="signupEmail" placeholder="Email" required>
    <input type="password" id="signupPassword" placeholder="Password" required>
    <button type="submit">Create Account</button>
  </form>

  <div id="message"></div>
</div>

<script src="auth.js"></script>
</body>
</html>
